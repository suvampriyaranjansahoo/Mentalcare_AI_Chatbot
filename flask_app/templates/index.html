<!DOCTYPE html>
<html>
<head>
    <title>MENTALCARE AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h1>💬 MENTALCARE AI</h1>
        <p class="disclaimer">
            This is a portfolio demo project, not a clinical tool. It does not
            diagnose, treat, or provide crisis support. If you are in distress,
            please contact a licensed professional or local emergency/crisis
            services.
        </p>
        <div id="chat-box"></div>
        <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" maxlength="500"/>
        <button id="send-btn">Send</button>
    </div>

    <script>
        function appendMessage(sender, msg) {
            var chatBox = document.getElementById('chat-box');
            var wrapper = document.createElement('div');
            wrapper.className = 'msg ' + (sender === 'You' ? 'you' : 'bot');

            var strong = document.createElement('b');
            strong.textContent = sender + ': ';

            wrapper.appendChild(strong);
            wrapper.appendChild(document.createTextNode(msg));

            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            var input = document.getElementById('user-input');
            var text = input.value.trim();
            if (text === '') return;

            appendMessage('You', text);
            input.value = '';

            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            })
                .then(function (res) {
                    if (!res.ok) throw new Error('Request failed');
                    return res.json();
                })
                .then(function (data) {
                    appendMessage('MENTALCARE AI', data.response);
                })
                .catch(function () {
                    appendMessage('MENTALCARE AI', 'Sorry, something went wrong. Please try again.');
                });
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
