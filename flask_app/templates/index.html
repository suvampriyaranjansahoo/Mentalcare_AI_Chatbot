<!DOCTYPE html>
<html>
<head>
    <title>MENTALCARE AI</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f5f5fa;
        }
        .chat-container{
            width: 500px;
            margin: 50px auto;
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #chat-box{
            height: 400px;
            overflow-y: scroll;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #f0f0ff;
        }
        .msg{
            padding: 5px 10px;
            margin: 5px 0;
            border-radius: 10px;
        }
        .msg.You{
            background-color: #d0f0fd;
            text-align: left;
        }
        .msg.MENTALCARE\ AI{
            background-color: #fdd0f0;
            text-align: left;
        }
        input[type=text]{
            width: 70%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button{
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            background-color: #6c63ff;
            color: white;
            cursor: pointer;
        }
        button:hover{
            background-color: #574fd6;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <h1>💬 MENTALCARE AI</h1>
        <div id="chat-box"></div>
        <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off"/>
        <button id="send-btn">Send</button>
    </div>
<script>
    function appendMessage(sender, msg){
        $('#chat-box').append('<div class="msg '+sender+'"><b>'+sender+':</b> '+msg+'</div>');
        $('#chat-box').scrollTop($('#chat-box')[0].scrollHeight);
    }

    $('#send-btn').click(function(){
        var user_msg = $('#user-input').val();
        if(user_msg.trim() != ''){
            appendMessage('You', user_msg);
            $('#user-input').val('');
            $.post("/get", {msg: user_msg}, function(data){
                appendMessage('MENTALCARE AI', data.bot);
            });
        }
    });

    $('#user-input').keypress(function(e){
        if(e.which == 13) $('#send-btn').click();
    });
</script>
</body>
</html>
