services:
  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: >
      ollama serve & server_pid=$$!;
      until ollama list >/dev/null 2>&1; do sleep 1; done;
      ollama pull qwen3:4b;
      ollama create my-qwen-chatbot -f /models/Modelfile;
      wait $$server_pid
    volumes:
      - ollama_models:/root/.ollama
      - ./deploy/ollama/Modelfile:/models/Modelfile:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama show my-qwen-chatbot >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  mentalcare-ai:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_DEBUG: "false"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env before starting the app}
      DATABASE_PATH: /app/data/mentalcare.db
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: my-qwen-chatbot
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_TIMEOUT_SECONDS: "60"
    volumes:
      - mentalcare_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
volumes:
  mentalcare_data:
  ollama_models:
