name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data pipeline (regenerate artifacts needed for tests)
        run: |
          python notebooks/02_data_split.py
          python notebooks/03_baseline_models.py
          python notebooks/05_model_comparison.py
          python notebooks/08_faq_experiment.py

      - name: Run tests
        run: pytest tests/ -v
